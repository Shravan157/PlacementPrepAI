version: "3.9"

services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - test_db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./datasets:/datasets

  # ── Isolated PostgreSQL for pytest only ──────────────────────────────────────
  # This is NOT the shared Supabase DB. The API always uses DATABASE_URL from .env
  # (pointing at Supabase). This service exists purely so pytest runs in isolation.
  # Port 5433 avoids conflicts with any local Postgres or Supabase tunnels on 5432.
  test_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test_db
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data   # ephemeral — data wiped on container stop
